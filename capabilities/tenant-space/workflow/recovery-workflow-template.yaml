apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: cap-002-tenant-space-recovery
  namespace: argo
  labels:
    testsuite.opencloud.wso2.com/capability-id: CAP-002
    testsuite.opencloud.wso2.com/purpose: cleanup-recovery
spec:
  entrypoint: recover
  serviceAccountName: cap-002-tenant-space
  activeDeadlineSeconds: 3600
  podSpecPatch: >-
    {"securityContext":{"fsGroup":65532,"fsGroupChangePolicy":"OnRootMismatch"}}
  synchronization:
    mutexes:
      - name: cap-002-tenant-space-vlan
  arguments:
    parameters:
      - name: state-key
  volumeClaimGC:
    strategy: OnWorkflowCompletion
  podGC:
    strategy: OnWorkflowCompletion
    deleteDelayDuration: 5m
  volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: harvester
        resources:
          requests:
            storage: 2Gi
  volumes:
    - name: harvester-kubeconfig
      secret:
        secretName: cap-002-target-credentials
        defaultMode: 0400
        items:
          - key: harvester-kubeconfig
            path: kubeconfig
    - name: tmp
      emptyDir: {}
  templates:
    - name: recover
      steps:
        - - name: prepare
            templateRef:
              name: cap-002-tenant-space
              template: prepare
            arguments:
              parameters:
                - name: state-key
                  value: "{{workflow.parameters.state-key}}"
                - name: preserve-on-failure
                  value: "false"
        - - name: init
            templateRef:
              name: cap-002-tenant-space
              template: terraform-init
        - - name: destroy
            templateRef:
              name: cap-002-tenant-space
              template: terraform-destroy
