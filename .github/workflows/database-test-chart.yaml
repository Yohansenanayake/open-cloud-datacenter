name: database-test-chart

# Lint and smoke-test the DBaaS Helm chart (database/charts/chart) against a
# plain kind cluster. This can verify the chart installs cleanly and the
# manager pod reaches Ready — it cannot verify real DBInstance provisioning,
# since kind has no KubeVirt/Harvester APIs; that needs a real Harvester
# cluster (my-docs/release/README.md §8's separate "Integration" stage).

on:
  pull_request:
    paths:
      - 'database/**'
      - '.github/workflows/database-test-chart.yaml'
  push:
    branches: [operators]
    paths:
      - 'database/**'
      - '.github/workflows/database-test-chart.yaml'
  workflow_dispatch:

permissions: {}

jobs:
  test-chart:
    permissions:
      contents: read
    name: Lint and deploy chart on kind
    runs-on: ubuntu-latest
    env:
      IMG: controller:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: database/go.mod
          cache-dependency-path: database/go.sum

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare dbaas image
        run: |
          cd database
          go mod tidy
          make docker-build
          kind load docker-image $IMG

      - name: Install Helm
        run: cd database && make install-helm

      - name: Lint Helm chart
        run: cd database && helm lint ./charts/chart

# TODO: Uncomment if cert-manager is enabled by default
