apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This is the single installation namespace for every namespaced resource in
# this overlay. The namespace must exist before applying the overlay.
namespace: dbaas-system

# This overlay uses whatever image config/manager/kustomization.yaml already points at. For local
# testing against your own GHCR .
# make deploy IMG=ghcr.io/<you>/dbaas-controller:<tag>


resources:
- ../../base
- operator_config.yaml

patches:
- path: manager_config_patch.yaml
  target:
    kind: Deployment
    name: controller-manager
