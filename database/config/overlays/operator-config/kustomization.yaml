apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This is the single installation namespace for every namespaced resource in
# this overlay. The namespace must exist before applying the overlay.
namespace: dbaas-system-v2

images:
- name: ghcr.io/yohansenanayake/dbaas-controller
  newName: ghcr.io/yohansenanayake/dbaas-controller
  newTag: dev-b658cf2-202607290025

resources:
- ../../base
- operator_config.yaml

patches:
- path: manager_config_patch.yaml
  target:
    kind: Deployment
    name: controller-manager
