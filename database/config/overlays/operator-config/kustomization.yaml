apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# This is the single installation namespace for every namespaced resource in
# this overlay. The namespace must exist before applying the overlay.
namespace: dbaas-system

images:
- name: wso2vick/ocd-dbaas
  newName: ghcr.io/tgcjananga/dbaas-controller
  newTag: v20260815_1

resources:
- ../../base
- operator_config.yaml

patches:
- path: manager_config_patch.yaml
  target:
    kind: Deployment
    name: controller-manager
