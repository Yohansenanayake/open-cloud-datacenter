{{- if .Values.rbac.helpers.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "dbaas.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    rbac.authorization.k8s.io/aggregate-to-view: "true"
  name: {{ include "dbaas.resourceName" (dict "suffix" "dbrestore-viewer-role" "context" $) }}
rules:
- apiGroups:
  - dbaas.opencloud.wso2.com
  resources:
  - dbrestores
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dbaas.opencloud.wso2.com
  resources:
  - dbrestores/status
  verbs:
  - get
{{- end }}
