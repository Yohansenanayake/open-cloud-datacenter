syntax = "proto3";

package dbaas.guest.v1;
option go_package = "github.com/wso2/open-cloud-datacenter/crds/dbaas/internal/guestprotocol/v1;guestprotocolv1";

import "google/protobuf/timestamp.proto";

// Never reuse field numbers or enum values. Reserve numbers AND names when
// removing fields. This is the first version; there are no retired fields yet.
message Command {
  uint32 protocol_major = 1;
  string message_id = 2;
  string operation_id = 3;
  string instance_uid = 4;
  string resource_uid = 5;
  google.protobuf.Timestamp issued_at = 6;
  google.protobuf.Timestamp admission_expires_at = 7;
  google.protobuf.Timestamp operation_deadline = 8;
  bytes intent_digest = 9;
  // Field numbers 10-19 are intentionally unassigned for envelope additions.
  oneof body {
    ValidateRepository validate_repository = 20;
    ApplyBackupPolicy apply_backup_policy = 21;
    RunBackup run_backup = 22;
    CreateSnapshot create_snapshot = 23;
    DisableAutomatedBackup disable_automated_backup = 24;
    DeleteAutomatedRecoveryData delete_automated_recovery_data = 25;
    AcquireRestoreHold acquire_restore_hold = 26;
    ReleaseRestoreHold release_restore_hold = 27;
    RestoreDatabase restore_database = 28;
    CancelOperation cancel_operation = 29;
    InspectState inspect_state = 30;
  }
}

enum CommandKind {
  COMMAND_KIND_UNSPECIFIED = 0;
  COMMAND_KIND_VALIDATE_REPOSITORY = 1;
  COMMAND_KIND_APPLY_BACKUP_POLICY = 2;
  COMMAND_KIND_RUN_BACKUP = 3;
  COMMAND_KIND_CREATE_SNAPSHOT = 4;
  COMMAND_KIND_DISABLE_AUTOMATED_BACKUP = 5;
  COMMAND_KIND_DELETE_AUTOMATED_RECOVERY_DATA = 6;
  COMMAND_KIND_ACQUIRE_RESTORE_HOLD = 7;
  COMMAND_KIND_RELEASE_RESTORE_HOLD = 8;
  COMMAND_KIND_RESTORE_DATABASE = 9;
  COMMAND_KIND_CANCEL_OPERATION = 10;
  COMMAND_KIND_INSPECT_STATE = 11;
}

message RepositoryIdentity {
  string repository_uid = 1;
  string source_instance_uid = 2;
  string endpoint = 3;
  string bucket = 4;
  string prefix = 5;
  string region = 6;
  bool force_path_style = 7;
}

// The immutable Secret UID + version identify credential intent. Encryption
// metadata and randomized ciphertext do not contribute to the intent digest.
message EncryptedCredential {
  string credential_uid = 1;
  string version = 2;
  string key_id = 3;
  string algorithm = 4;
  bytes ciphertext = 5;
}

message ValidateRepository {
  RepositoryIdentity repository = 1;
  EncryptedCredential credential = 2;
}
message ApplyBackupPolicy {
  uint64 policy_generation = 1;
  RepositoryIdentity repository = 2;
  EncryptedCredential credential = 3;
  uint32 retention_days = 4; // 1-35; disabling is a separate command.
  string preferred_window_utc = 5; // HH:MM-HH:MM, including midnight wrap.
}
enum BackupType {
  BACKUP_TYPE_UNSPECIFIED = 0;
  BACKUP_TYPE_FULL = 1;
  BACKUP_TYPE_DIFFERENTIAL = 2;
}
enum BackupReason {
  BACKUP_REASON_UNSPECIFIED = 0;
  BACKUP_REASON_INITIAL = 1;
  BACKUP_REASON_SCHEDULED = 2;
  BACKUP_REASON_CATCH_UP = 3;
}
message RunBackup {
  RepositoryIdentity repository = 1;
  uint64 policy_generation = 2;
  BackupType type = 3;
  BackupReason reason = 4;
}
enum SnapshotType {
  SNAPSHOT_TYPE_UNSPECIFIED = 0;
  SNAPSHOT_TYPE_MANUAL = 1;
  SNAPSHOT_TYPE_FINAL = 2;
}
message CreateSnapshot {
  string snapshot_uid = 1;
  SnapshotType type = 2;
  RepositoryIdentity repository = 3;
  EncryptedCredential credential = 4;
}
message DisableAutomatedBackup { uint64 policy_generation = 1; }
message DeleteAutomatedRecoveryData {
  RepositoryIdentity repository = 1;
  string deleting_resource_uid = 2;
  uint64 policy_generation = 3;
  uint64 deletion_generation = 4;
}

// Frozen lineage: never send an unresolved "latest" selector to the guest.
message RestoreSource {
  RepositoryIdentity repository = 1;
  string backup_label = 2;
  uint32 postgres_major = 3;
  string system_identifier = 4;
  uint32 timeline = 5;
  oneof recovery_target {
    google.protobuf.Timestamp target_time = 6;
    SnapshotSource snapshot = 7;
  }
}
message SnapshotSource {
  string snapshot_uid = 1;
  SnapshotType type = 2;
}
message RestoreHold {
  string hold_id = 1;
  uint64 generation = 2;
  string target_instance_uid = 3;
  RestoreSource source = 4;
  // No TTL: expiry cannot establish that source reads have stopped.
}
message AcquireRestoreHold { RestoreHold hold = 1; }
enum HoldReleaseReason {
  HOLD_RELEASE_REASON_UNSPECIFIED = 0;
  HOLD_RELEASE_REASON_SOURCE_READS_FINISHED = 1;
  HOLD_RELEASE_REASON_TARGET_FENCED = 2;
}
message ReleaseRestoreHold {
  RestoreHold hold = 1;
  HoldReleaseReason reason = 2;
  string evidence_operation_id = 3; // Must be checked against authoritative state.
}
message RestoreDatabase {
  RestoreSource source = 1;
  string target_instance_uid = 2;
  string target_volume_uid = 3;
  EncryptedCredential credential = 4;
  string hold_id = 5;
  uint64 hold_generation = 6;
}
message CancelOperation { string target_operation_id = 1; }
enum StateSection {
  STATE_SECTION_UNSPECIFIED = 0;
  STATE_SECTION_POLICY = 1;
  STATE_SECTION_BACKUP_HEALTH = 2;
  STATE_SECTION_OPERATIONS = 3;
  STATE_SECTION_SAFETY = 4;
}
message InspectState { repeated StateSection sections = 1; }

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_ADMITTED = 1;
  OPERATION_STATE_RUNNING = 2;
  OPERATION_STATE_RETRY_WAIT = 3;
  OPERATION_STATE_SUCCEEDED = 4;
  OPERATION_STATE_FAILED = 5;
  OPERATION_STATE_CANCELLED = 6;
  OPERATION_STATE_OUTCOME_UNKNOWN = 7;
}
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_COMMAND = 1;
  ERROR_CODE_PROTOCOL_MISMATCH = 2;
  ERROR_CODE_IDENTITY_MISMATCH = 3;
  ERROR_CODE_OPERATION_CONFLICT = 4;
  ERROR_CODE_ADMISSION_EXPIRED = 5;
  ERROR_CODE_DEADLINE_EXCEEDED = 6;
  ERROR_CODE_BACKLOG_FULL = 7;
  ERROR_CODE_STALE_GENERATION = 8;
  ERROR_CODE_PREREQUISITE_PENDING = 9;
  ERROR_CODE_STORAGE_UNAVAILABLE = 10;
  ERROR_CODE_OUTCOME_UNKNOWN = 11;
  ERROR_CODE_INTERNAL = 12;
}
// Message is chosen from a fixed safe catalogue, never subprocess/SDK output.
message SafeError {
  ErrorCode code = 1;
  bool retryable = 2;
  string message = 3;
}
message AdmissionReceipt {
  string message_id = 1;
  string operation_id = 2;
  string instance_uid = 3;
  string resource_uid = 4;
  bytes intent_digest = 5;
  google.protobuf.Timestamp admitted_at = 6;
  OperationState state = 7;
}
message SubmitResponse {
  uint32 protocol_major = 1;
  oneof outcome {
    AdmissionReceipt receipt = 2;
    SafeError rejection = 3;
  }
}

// Every event has a stable ID. Command-caused events bind both command IDs.
// Admitted/status events have a positive per-operation monotonic sequence;
// pre-admission rejections use zero and cannot advance an accepted operation.
message Event {
  uint32 protocol_major = 1;
  string event_id = 2;
  string instance_uid = 3;
  string resource_uid = 4;
  string operation_id = 5;
  string command_message_id = 6;
  uint64 event_sequence = 7;
  google.protobuf.Timestamp occurred_at = 8;
  string agent_version = 9;
  oneof body {
    AgentHello hello = 20;
    AdmissionReceipt admitted = 21;
    SafeError rejected = 22;
    OperationStatus operation_status = 23;
    BackupHealth backup_health = 24;
    AgentHeartbeat heartbeat = 25;
  }
}
message AgentHello {
  repeated uint32 protocol_majors = 1;
  repeated CommandKind capabilities = 2;
  string executor_version = 3;
  uint32 task_schema_version = 4;
  uint64 applied_policy_generation = 5;
}
message AgentHeartbeat { uint64 uptime_seconds = 1; }
message OperationStatus {
  OperationState state = 1;
  uint32 attempt = 2;
  uint64 observed_policy_generation = 3;
  SafeError error = 4;
  oneof result {
    RepositoryValidated repository_validated = 10;
    PolicyApplied policy_applied = 11;
    BackupArtifact backup = 12;
    SnapshotCreated snapshot_created = 13;
    AutomationDisabled automation_disabled = 14;
    AutomatedDataDeleted automated_data_deleted = 15;
    HoldAcknowledged hold_acknowledged = 16;
    RestoreCompleted restore_completed = 17;
    CancellationRecorded cancellation_recorded = 18;
    StateInspection inspection = 19;
  }
}
message RepositoryValidated { RepositoryIdentity repository = 1; string credential_version = 2; }
message PolicyApplied { uint64 policy_generation = 1; string credential_version = 2; }
message BackupArtifact {
  RepositoryIdentity repository = 1;
  string backup_label = 2;
  google.protobuf.Timestamp completed_at = 3;
  uint32 postgres_major = 4;
  string system_identifier = 5;
  uint32 timeline = 6;
}
message SnapshotCreated { string snapshot_uid = 1; SnapshotType type = 2; BackupArtifact artifact = 3; }
message AutomationDisabled { uint64 policy_generation = 1; }
message AutomatedDataDeleted { string repository_uid = 1; uint64 deletion_generation = 2; }
message HoldAcknowledged { string hold_id = 1; uint64 generation = 2; bool released = 3; }
message RestoreCompleted {
  RestoreSource source = 1;
  string target_volume_uid = 2;
  bool recovery_ended = 3;
  bool managed_credentials_replaced = 4;
  bool writable = 5;
  bool source_reads_finished = 6;
}
message CancellationRecorded { string target_operation_id = 1; }
enum HealthState {
  HEALTH_STATE_UNSPECIFIED = 0;
  HEALTH_STATE_HEALTHY = 1;
  HEALTH_STATE_DEGRADED = 2;
  HEALTH_STATE_UNKNOWN = 3;
  HEALTH_STATE_DISABLED = 4;
}
message RecoveryBounds {
  google.protobuf.Timestamp earliest_restorable_time = 1;
  google.protobuf.Timestamp latest_restorable_time = 2;
  google.protobuf.Timestamp verified_at = 3;
  string system_identifier = 4;
  uint32 timeline = 5;
  string base_backup_label = 6;
}
message BackupHealth {
  google.protobuf.Timestamp observed_at = 1;
  uint64 applied_policy_generation = 2;
  bool automation_enabled = 3;
  HealthState scheduler = 4;
  HealthState repository = 5;
  HealthState archiver = 6;
  BackupArtifact last_backup = 7;
  google.protobuf.Timestamp last_archive_upload_at = 8;
  RecoveryBounds recovery_bounds = 9;
  SafeError error = 10;
  string applied_credential_version = 11;
  RepositoryIdentity repository_identity = 12;
  HealthState pitr = 13;
  bool initial_backup_complete = 14;
}
message OperationSummary { string operation_id = 1; OperationState state = 2; uint64 last_event_sequence = 3; }
message SafetyState {
  repeated RestoreHold holds = 1;
  uint64 cleanup_generation = 2;
  bool cleanup_pending = 3;
  bool restore_barrier = 4;
}
message StateInspection {
  BackupHealth backup_health = 1;
  repeated OperationSummary operations = 2;
  SafetyState safety = 3;
}

// Task type/queue are Asynq metadata. Secrets and mutable configuration stay out
// of Redis; the executor loads the accepted intent from SQLite by identity.
message TaskPayload {
  uint32 schema_version = 1;
  string operation_id = 2;
  string instance_uid = 3;
}
message SafetyTaskPayload {
  uint32 schema_version = 1;
  string operation_id = 2;
  string instance_uid = 3;
  uint64 cleanup_generation = 4;
}

// Typed local IPC contracts. Framing, peer authentication, durable admission and
// transactional event publication acknowledgements are implemented in step 06.
message LocalRequest {
  uint32 protocol_major = 1;
  string request_id = 2;
  string instance_uid = 3;
  oneof body {
    Command submit = 10;
    InspectState inspect = 11;
    ReadPendingEvents read_pending_events = 12;
    AcknowledgeEvents acknowledge_events = 13;
    GetCapabilities get_capabilities = 14;
  }
}
message ReadPendingEvents { uint32 limit = 1; }
message AcknowledgeEvents { repeated string event_ids = 1; }
message GetCapabilities {}
message PendingEvents { repeated Event events = 1; bool has_more = 2; }
message EventsAcknowledged { repeated string event_ids = 1; }
message LocalResponse {
  uint32 protocol_major = 1;
  string request_id = 2;
  oneof body {
    SubmitResponse submission = 10;
    StateInspection inspection = 11;
    PendingEvents pending_events = 12;
    EventsAcknowledged events_acknowledged = 13;
    AgentHello capabilities = 14;
    SafeError error = 15;
  }
}
